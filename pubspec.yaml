version: 1.0.5+5

environment:
  sdk: ">=2.17.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  provider: ^6.0.3
  intl: ^0.17.0
  gauges: ^1.0.0
  fl_chart: ^0.55.0
