name: sejerslev_demo
description: A new Flutter project.

publish_to: "none"

version: 1.0.2+2

environment:
  sdk: ">=2.17.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  percent_indicator: ^4.2.2
  syncfusion_flutter_gauges: ^20.1.60
  fl_chart: ^0.55.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
